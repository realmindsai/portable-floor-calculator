# Dependabot — security updates only, grouped, weekly, no auto-merge.
# Security-only (no scheduled version bumps) keeps this aligned with the
# supply-chain cooldown ethos: version updates would raise PRs for brand-new
# releases (the malicious-package window min-release-age=3 exists to block),
# whereas security updates target already-vetted advisories. Repo-level
# "Dependabot security updates" must also be ON (free, incl. private repos).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # 0 disables scheduled version updates; security updates ignore this limit.
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
